[package]
name = "repo-search-coreml"
version = "0.0.10"
description = "Core ML token embedding for repo-search (Apple Silicon)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ondevice-coreml = { workspace = true, features = ["headroom"] }
repo-search-core.workspace = true
thiserror = { version = "2.0.21", default-features = false }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
