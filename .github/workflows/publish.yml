name: publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish crates to crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Request crates.io token
        id: crates-io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        env:
          CRATES_IO_TOKEN: ${{ steps.crates-io.outputs.token }}
        run: |
          set -euo pipefail
          # crates.io sparse-index path for a crate name.
          index_path() {
            local name="$1"
            case "${#name}" in
              1) echo "1/$name" ;;
              2) echo "2/$name" ;;
              3) echo "3/${name:0:1}/$name" ;;
              *) echo "${name:0:2}/${name:2:2}/$name" ;;
            esac
          }
          # Publish crates in dependency order, skipping versions already on
          # crates.io so a release that bumps only some crates still succeeds.
          for crate in repo-search-core repo-search-coreml repo-search; do
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .version')
            if curl -sf "https://index.crates.io/$(index_path "$crate")" \
                | jq -r .vers | grep -qxF "$version"; then
              echo "skip $crate $version: already on crates.io"
            else
              cargo publish -p "$crate" --token "$CRATES_IO_TOKEN"
            fi
          done
