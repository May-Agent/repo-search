name: model

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - "convert/**"
      - ".github/workflows/model.yml"

permissions:
  contents: read

concurrency:
  group: model-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  convert:
    name: Convert and package EmbeddingGemma 2
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Convert, verify and package
        working-directory: convert
        run: |
          set -euo pipefail
          uv sync --locked
          uv run --locked repo-search-convert --work-dir "$RUNNER_TEMP/model"
      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eg2-coreml-archive
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/model/*.tar.zst
            ${{ runner.temp }}/model/*.tar.zst.sha256