name: linux

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - core/**
      - tests/**
      - templates/**
      - .github/workflows/linux.yml
  push:
    branches:
      - dev
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - core/**
      - tests/**
      - templates/**
      - .github/workflows/linux.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: clippy, test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: clippy
        run: |
          cargo clippy --locked -p repo-search -p repo-search-core -p repo-search-client --all-targets -- -D warnings
      - name: test
        run: |
          cargo test --locked -p repo-search -p repo-search-core -p repo-search-client
