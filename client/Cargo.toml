[package]
name = "repo-search-client"
version = "0.0.3"
description = "Client and wire protocol of the repo-search daemon"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Starting the daemon: the paths, the launchd agents on macOS, the
# on-demand spawn on Linux and the `Launcher` trait with its connect and
# recover sequence.
launcher = [
    "dep:askama",
    "dep:libc",
    "dep:tempfile",
    "dep:toml_edit",
    "dep:etcetera",
    "dep:kqueue",
    "tokio/fs",
    "tokio/io-util",
    "tokio/process",
    "tokio/rt",
    "tokio/time",
]

[dependencies]
libc = { version = "0.2.191", optional = true, default-features = false, features = ["std"] }
toml_edit = { version = "0.25.17", optional = true, default-features = false, features = ["parse"] }
futures-util = { version = "0.3.34", default-features = false, features = [
    "sink",
    "std",
] }
serde = { version = "1.0.229", default-features = false, features = [
    "derive",
    "std",
] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", default-features = false, features = ["net"] }
tokio-util = { version = "0.7.20", default-features = false, features = [
    "codec",
] }

[target.'cfg(target_os = "macos")'.dependencies]
askama = { version = "0.16.1", optional = true, default-features = false, features = [
    "derive",
    "std",
] }
tempfile = { version = "3.27.0", optional = true, default-features = false }
kqueue = { version = "1.2.1", optional = true, default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
etcetera = { version = "0.11.0", optional = true, default-features = false }

[dev-dependencies]
tempfile = { version = "3.27.0", default-features = false }
tokio = { version = "1.54.1", default-features = false, features = [
    "io-util",
    "macros",
    "rt",
] }
