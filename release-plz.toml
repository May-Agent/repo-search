[workspace]
git_only = false
publish = false
git_release_enable = false
# Before 1.0 the public API changes freely, and the crates.io baseline is an
# empty placeholder, so there is no API to check against.
semver_check = false

[[package]]
name = "repo-search"
git_tag_name = "v{{ version }}"

[[package]]
name = "repo-search-core"
git_tag_name = "core/v{{ version }}"

[[package]]
name = "repo-search-coreml"
git_tag_name = "coreml/v{{ version }}"
