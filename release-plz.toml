[workspace]
git_only = true
publish = false
git_release_enable = false
# Before 1.0 the public API changes freely.
semver_check = false

[[package]]
name = "repo-search"
git_tag_name = "v{{ version }}"

[[package]]
name = "repo-search-core"
git_tag_name = "core/v{{ version }}"

[[package]]
name = "repo-search-coreml"
git_tag_name = "coreml/v{{ version }}"

[[package]]
name = "repo-search-server"
git_tag_name = "server/v{{ version }}"
