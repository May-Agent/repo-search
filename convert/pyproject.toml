[project]
name = "repo-search-convert"
version = "0.1.0"
description = "Convert EmbeddingGemma 2 to a Core ML multifunction model"
authors = [
    { name = "Lexo Liu", email = "me@lexo.cool" }
]
requires-python = ">=3.13"
dependencies = [
    "coremltools>=9.0",
    "huggingface-hub>=2.2.0",
    "numpy>=2.5.4",
    "torch==2.7.0",
    "transformers>=5.20.1",
    "zstandard>=0.25.0",
]

[project.scripts]
repo-search-convert = "repo_search_convert:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
