[package]
name = "repo-search-server"
version = "0.0.2"
description = "repo-search's embedding server"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
stub = []

[dependencies]
constant_time_eq = { version = "0.4.2", default-features = false }
http-body-util = { version = "0.1.5", default-features = false }
hyper = { version = "1.12.0", default-features = false, features = [
    "http1",
    "server",
] }
hyper-util = { version = "0.1.21", default-features = false, features = [
    "http1",
    "server",
    "server-graceful",
    "tokio",
] }
repo-search-core.workspace = true
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
thiserror = { version = "2.0.21", default-features = false }
tokio = { version = "1.54.1", default-features = false, features = [
    "macros",
    "net",
    "rt",
    "signal",
    "sync",
    "time",
] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
repo-search-coreml.workspace = true
libc = { version = "0.2.191", default-features = false, features = ["std"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = { version = "3.27.0", default-features = false }
tokio = { version = "1.54.1", default-features = false, features = [
    "macros",
    "rt-multi-thread",
    "time",
] }

[[test]]
name = "scheduler"
path = "tests/scheduler.rs"
required-features = ["stub"]

[[test]]
name = "api"
path = "tests/api.rs"
required-features = ["stub"]