[package]
name = "repo-search-server"
version = "0.0.2"
description = "repo-search's embedding server"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
stub = []

[dependencies]
repo-search-core.workspace = true
thiserror = { version = "2.0.21", default-features = false }
tokio = { version = "1.54.0", default-features = false, features = [
    "macros",
    "rt",
    "sync",
] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
repo-search-coreml.workspace = true
libc = { version = "0.2.191", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1.54.0", default-features = false, features = [
    "rt-multi-thread",
    "time",
] }

[[test]]
name = "scheduler"
path = "tests/scheduler.rs"
required-features = ["stub"]
