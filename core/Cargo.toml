[package]
name = "repo-search-core"
version = "0.0.1"
description = "Chunking, index store, reconcile and retrieval for repo-search"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = [
    "lang-c",
    "lang-cpp",
    "lang-go",
    "lang-javascript",
    "lang-python",
    "lang-rust",
    "lang-swift",
    "lang-typescript",
]
lang-c = ["dep:tree-sitter-c"]
lang-cpp = ["dep:tree-sitter-cpp"]
lang-go = ["dep:tree-sitter-go"]
lang-javascript = ["dep:tree-sitter-javascript"]
lang-python = ["dep:tree-sitter-python"]
lang-rust = ["dep:tree-sitter-rust"]
lang-swift = ["dep:tree-sitter-swift"]
lang-typescript = ["dep:tree-sitter-typescript"]

[build-dependencies]
sha2 = { version = "0.11.1", default-features = false }
toml_edit = { version = "0.25.17", default-features = false, features = ["parse"] }

[dependencies]
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
blake3 = { version = "1.8.7", default-features = false }
globset = { version = "0.4.20", default-features = false }
ignore = { version = "0.4.33", default-features = false }
jsonc-parser = { version = "0.34.0", default-features = false }
memmap2 = { version = "0.9.11", default-features = false }
numkong = { version = "7.8.5", default-features = false }
pulldown-cmark = { version = "0.13.4", default-features = false }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
saphyr-parser = { version = "0.2.2", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
smallvec = { version = "1.16.3", default-features = false }
thiserror = { version = "2.0.21", default-features = false }
tokio = { version = "1.54.0", default-features = false, features = ["macros", "sync"] }
toml_edit = { version = "0.25.17", default-features = false, features = ["parse"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tree-sitter = { version = "0.27.1", default-features = false }
tree-sitter-c = { version = "0.24.2", default-features = false, optional = true }
tree-sitter-cpp = { version = "0.23.4", default-features = false, optional = true }
tree-sitter-go = { version = "0.25.0", default-features = false, optional = true }
tree-sitter-javascript = { version = "0.25.0", default-features = false, optional = true }
tree-sitter-python = { version = "0.25.0", default-features = false, optional = true }
tree-sitter-rust = { version = "0.24.2", default-features = false, optional = true }
tree-sitter-swift = { version = "0.7.4", default-features = false, optional = true }
tree-sitter-typescript = { version = "0.23.2", default-features = false, optional = true }
unicode-general-category = { version = "1.1.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "0.2.191", default-features = false }

[dev-dependencies]
futures-executor = { version = "0.3.34", default-features = false, features = ["std"] }
tempfile = { version = "3.27.0", default-features = false }
