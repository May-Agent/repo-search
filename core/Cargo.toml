[package]
name = "repo-search-core"
version = "0.0.0"
description = "Chunking, index store, reconcile and retrieval for repo-search"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = { version = "1.8.7", default-features = false }
half = { version = "2.7.1", default-features = false }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
thiserror = { version = "2.0.21", default-features = false }
tokio = { version = "1.54.0", default-features = false, features = ["sync"] }

[dev-dependencies]
futures-executor = { version = "0.3.34", default-features = false, features = ["std"] }
tempfile = { version = "3.27.0", default-features = false }
